[package]
name = "ragasukma-core"
version = "0.3.1"
edition = "2024"
authors = ["Ahlan Saputra <hlnsptr@gmail.com>"]
description = "Headless autonomous agent runtime, tool registry, and multi-provider LLM engine for Ragasukma"
license = "MIT"
repository = "https://github.com/ahlanefwolf/ragasukma-core"
readme = "README.md"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart", "rustls-tls"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-stream = "0.3"
form_urlencoded = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
libc = "0.2"
regex = "1.10"
sha2 = "0.10"
base64 = "0.22"
ignore = "0.4"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
]